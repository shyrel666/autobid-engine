<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoBid 前端设计样稿</title>
  <style>
    :root { color-scheme: light; --canvas:#fafafa; --panel:#fff; --fg:#171717; --muted:#737373; --soft:#f5f5f5; --border:#e5e5e5; --primary:#171717; --blue:#2563eb; --green:#059669; --amber:#d97706; --red:#dc2626; --sidebar:272px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--fg); font:14px/20px "Segoe UI","Microsoft YaHei",sans-serif; }
    button,input,textarea,select { font:inherit; color:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid #a3a3a380; outline-offset:2px; }
    button:disabled { opacity:.5; cursor:default; }
    h1,h2,h3,p { margin:0; }
    .icon { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .row { display:flex; align-items:center; gap:8px; min-width:0; }
    .spread { justify-content:space-between; }
    .muted { color:var(--muted); }
    .small { font-size:12px; line-height:16px; }
    .truncate { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .spacer { flex:1; }
    .shell { display:flex; height:100svh; overflow:hidden; }
    .sidebar { width:var(--sidebar); flex-shrink:0; padding:16px; display:flex; flex-direction:column; gap:20px; }
    .brand { height:40px; padding:0 8px; font-size:18px; font-weight:650; gap:12px; }
    .brand-mark { width:28px; height:28px; border-radius:8px; background:#2563eb; color:white; display:grid; place-items:center; flex-shrink:0; }
    .group-label { font-size:12px; color:var(--muted); height:32px; display:flex; align-items:center; padding:0 8px; }
    .nav-item { height:32px; padding:0 8px; gap:8px; border-radius:8px; margin-bottom:4px; }
    .nav-item.active,.nav-item:hover { background:var(--soft); }
    .nav-item.active { font-weight:600; }
    .nav-count { margin-left:auto; border-radius:10px; padding:0 6px; color:#fff; background:var(--amber); font-size:11px; line-height:18px; }
    .sidebar-footer { margin-top:auto; padding:8px; display:flex; gap:8px; align-items:center; }
    .status-dot { width:6px; height:6px; background:currentColor; border-radius:50%; flex-shrink:0; }
    .frame { flex:1; min-width:0; min-height:0; margin:8px 8px 8px 0; border:1px solid var(--border); border-radius:14px; box-shadow:0 1px 3px #00000014; background:var(--panel); overflow:hidden; display:flex; flex-direction:column; }
    .global-header { height:48px; flex-shrink:0; border-bottom:1px solid var(--border); padding:0 24px; }
    .divider { height:16px; width:1px; background:var(--border); margin:0 8px; }
    .icon-button { width:32px; height:32px; border:1px solid transparent; border-radius:10px; display:grid; place-items:center; background:transparent; flex-shrink:0; }
    .icon-button:hover { background:var(--soft); }
    .search-trigger { border:0; background:transparent; color:var(--muted); padding:0; }
    kbd { font:11px/18px "Segoe UI",sans-serif; padding:0 5px; border:1px solid var(--border); background:var(--soft); border-radius:4px; }
    .content { flex:1; min-height:0; min-width:0; padding:24px; overflow:auto; }
    .card { border:1px solid var(--border); border-radius:14px; background:var(--panel); overflow:hidden; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 10px; border:1px solid var(--border); border-radius:10px; background:white; white-space:nowrap; }
    .button:hover { background:var(--soft); }
    .button.primary { color:#fafafa; background:var(--primary); border-color:var(--primary); }
    .button.primary:hover { background:#404040; }
    .button.danger { color:var(--red); }
    .button.small-button { height:28px; border-radius:8px; font-size:13px; }
    .input { border:1px solid var(--border); border-radius:10px; height:32px; padding:0 10px; background:white; width:100%; min-width:0; }
    .input::placeholder,textarea::placeholder { color:var(--muted); }
    .badge { display:inline-flex; align-items:center; gap:6px; width:max-content; padding:2px 8px; border-radius:7px; border:1px solid var(--border); font-size:12px; line-height:16px; white-space:nowrap; }
    .badge.blue { color:var(--blue); background:#eff6ff; border-color:#bfdbfe; }
    .badge.green { color:var(--green); background:#ecfdf5; border-color:#a7f3d0; }
    .badge.amber { color:var(--amber); background:#fffbeb; border-color:#fde68a; }
    .badge.gray { color:var(--muted); background:var(--soft); }
    .table-toolbar { min-height:88px; padding:24px; gap:8px; }
    .table-search { width:320px; }
    .table-search .input { padding-left:32px; }
    .input-wrap { position:relative; }
    .input-wrap>.icon { position:absolute; top:8px; left:10px; color:var(--muted); }
    .table-filter { width:144px; }
    .table-wrap { overflow:auto; }
    table { border-collapse:collapse; width:100%; table-layout:fixed; }
    th { height:40px; text-align:left; font-weight:500; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    td { height:48px; border-bottom:1px solid #ededed; }
    th,td { padding:8px 16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    tr:last-child td { border-bottom:0; }
    .table-footer { min-height:60px; padding:16px 24px; border-top:1px solid var(--border); }
    .page-size { width:64px; height:28px; }
    .task-header { padding:10px 24px 0; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
    .task-top { min-height:28px; gap:8px; }
    .task-top h1 { font-size:14px; font-weight:600; }
    .task-id { background:var(--soft); padding:1px 6px; border-radius:4px; font-size:12px; color:var(--muted); }
    .task-subtitle { font-size:12px; line-height:16px; }
    .nav-scroll { overflow:auto; scrollbar-width:none; }
    .primary-tabs { display:inline-flex; height:32px; padding:3px; border-radius:10px; background:var(--soft); gap:1px; white-space:nowrap; }
    .primary-tab { border:0; background:transparent; color:var(--muted); padding:0 8px; border-radius:8px; font-weight:500; line-height:24px; white-space:nowrap; }
    .primary-tab.active { color:var(--fg); background:white; box-shadow:0 1px 2px #00000015; }
    .secondary-tabs { display:flex; gap:16px; height:32px; white-space:nowrap; }
    .secondary-tab { border:0; background:none; padding:0; color:var(--muted); font-size:12px; border-bottom:2px solid transparent; }
    .secondary-tab.active { color:var(--fg); border-bottom-color:var(--fg); }
    .execution { display:grid; grid-template-columns:288px minmax(0,1fr); gap:16px; height:100%; min-height:0; }
    .pane { min-height:0; min-width:0; display:flex; flex-direction:column; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:white; }
    .pane-header { padding:12px 16px; min-height:48px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .pane-header h2 { font-size:14px; line-height:20px; font-weight:600; }
    .work-list { padding:8px; overflow:auto; flex:1; }
    .work-group { color:var(--muted); font-size:12px; padding:12px 8px 4px; }
    .work-row { border:0; width:100%; text-align:left; background:white; border-radius:8px; padding:8px; display:flex; align-items:center; gap:8px; min-height:44px; }
    .work-row.active { background:var(--soft); }
    .work-row .label { min-width:0; flex:1; }
    .work-row .icon { width:14px; height:14px; }
    .events { flex:1; overflow:auto; min-height:0; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .event { background:var(--soft); border-radius:10px; padding:12px; }
    .event-meta { font-size:12px; line-height:16px; color:var(--muted); margin-bottom:6px; }
    .event-toggle { border:0; background:none; padding:0; font-size:12px; color:var(--muted); }
    pre { font:12px/18px Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; margin:10px 0 0; padding:12px; background:white; border:1px solid var(--border); border-radius:8px; }
    .composer { flex-shrink:0; border-top:1px solid var(--border); padding:12px; }
    .composer .input { height:36px; }
    .composer .button { height:36px; }
    .composer-note { font-size:12px; color:var(--muted); margin-top:6px; }
    .mobile-work-picker { display:none; }
    .page-title { margin-bottom:24px; }
    .page-title h1 { font-size:24px; line-height:32px; font-weight:600; }
    .page-title p { color:var(--muted); margin-top:4px; }
    .settings-grid { display:grid; grid-template-columns:336px minmax(0,1fr); gap:24px; align-items:start; }
    .settings-card { padding:16px; }
    .settings-card h2 { font-size:16px; line-height:24px; font-weight:600; }
    .profile { padding:12px; border:1px solid var(--border); border-radius:10px; margin-top:12px; }
    .profile.active { border-color:var(--fg); box-shadow:0 0 0 1px var(--fg); background:#fffbf2; }
    .profile p { margin:6px 0; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
    .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .field.full { grid-column:1/-1; }
    .field small { font-size:12px; line-height:16px; color:var(--muted); }
    .form-actions { margin-top:24px; justify-content:flex-end; }
    .writing { display:grid; height:100%; grid-template-columns:240px minmax(520px,1fr) 320px; gap:16px; }
    .section-item { padding:10px 12px; margin:4px 8px; border-radius:8px; }
    .section-item.active { background:var(--soft); }
    .document { flex:1; overflow:auto; padding:24px; }
    .document h2 { font-size:20px; line-height:28px; margin-bottom:16px; }
    .document h3 { font-size:16px; margin:20px 0 10px; }
    .document p { line-height:26px; margin-bottom:12px; }
    .evidence-item { border:1px solid var(--border); border-radius:10px; margin:12px; padding:12px; }
    .evidence-item p { margin:8px 0; }
    .collapsed { --sidebar:64px; }
    .collapsed .sidebar { padding:16px; gap:16px; }
    .collapsed .brand { padding:0; }
    .collapsed .nav-item { padding:8px; }
    .collapsed .brand-name,.collapsed .nav-text,.collapsed .group-label,.collapsed .nav-count,.collapsed .footer-text { display:none; }
    .collapsed .sidebar-footer { padding:8px; }
    .collapsed .frame { margin-left:8px; }
    @media (max-width:1199px) and (min-width:768px) { body:not(.expanded) { --sidebar:64px; } body:not(.expanded) .sidebar { padding:16px; } body:not(.expanded) .nav-text,body:not(.expanded) .brand-name,body:not(.expanded) .group-label,body:not(.expanded) .footer-text,body:not(.expanded) .nav-count { display:none; } body:not(.expanded) .brand { padding:0; } body:not(.expanded) .frame { margin-left:8px; } }
    @media (max-width:767px) {
      .sidebar { display:none; } .frame,.collapsed .frame { margin:0; border:0; border-radius:0; box-shadow:none; }
      .global-header { padding:0 16px; } .content { padding:16px; } .header-status { display:none; }
      .task-header { padding:10px 16px 0; gap:8px; } .task-top { flex-wrap:wrap; } .task-top h1 { max-width:260px; } .task-id,.task-actions { display:none; }
      .task-subtitle { white-space:normal; } .primary-tab { padding:0 6px; } .secondary-tabs { gap:14px; }
      .execution { grid-template-columns:minmax(0,1fr); grid-template-rows:32px minmax(0,1fr); gap:8px; }
      .execution>.work-pane { display:none; } .mobile-work-picker { display:flex; }
      .pane-header { padding:10px 12px; flex-wrap:wrap; gap:6px; } .pane-header h2 { font-size:13px; }
      .events { padding:12px; gap:10px; } .event { padding:10px; } .composer { padding:10px; } .composer-note { font-size:11px; }
      .settings-grid { grid-template-columns:1fr; } .table-toolbar { flex-wrap:wrap; padding:16px; } .table-search { width:100%; }
      .table-wrap table { min-width:880px; } .form-grid { grid-template-columns:1fr; } .field.full { grid-column:auto; }
      .writing { display:flex; } .writing>.pane:first-child,.writing>.pane:last-child { display:none; }
    }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="m10 3 4 0 1 3 3 1 3 4-2 3-1 4-4 1-3 2-4-3-1-3-3-1 0-4 3-1 1-3z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5v16M3 4h5l4 2 4-2h5v15h-5l-4 2-4-2H3z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 3 19 9-19 9 3-9-3-9zm3 9h16"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14 5a6 6 0 0 0-7 7l-4 5 4 4 5-5a6 6 0 0 0 7-7l-4 3-3-3z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</defs></svg>
<div id="app"></div>
<script>
  // 固定的投标业务示例；本文件只定义视觉目标，不请求 API，不提交任何业务动作。
  const params = new URLSearchParams(location.search);
  const view = params.get('view') || 'projects';
  const expanded = params.get('detail') === 'expanded';
  if (params.get('sidebar') === 'collapsed') document.body.classList.add('collapsed');
  const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const badge = (label,tone='gray') => `<span class="badge ${tone}"><span class="status-dot"></span>${label}</span>`;
  const button = (label,name='',variant='',disabled=false) => `<button type="button" class="button ${variant}"${disabled?' disabled':''}>${name?icon(name):''}${label}</button>`;
  const nav = (label,name,active=false,count='') => `<div class="row nav-item ${active?'active':''}" data-region="nav-item">${icon(name)}<span class="nav-text">${label}</span>${count?`<span class="nav-count">${count}</span>`:''}</div>`;
  const sidebar = `<aside class="sidebar" data-region="sidebar"><div class="row brand"><span class="brand-mark">${icon('file')}</span><span class="brand-name">AutoBid</span></div><div><div class="group-label">工作区</div>${nav('投标项目','file',view!=='models')}${nav('工具调用审批','check',false,'1')}</div><div><div class="group-label">企业资料</div>${nav('企业资信库','book')}${nav('企业方案知识库','book')}</div><div><div class="group-label">系统</div>${nav('模型配置','gear',view==='models')}</div><div class="sidebar-footer"><span class="status-dot" style="color:var(--green)"></span><div class="footer-text"><div>服务已连接</div><div class="small muted">辅助起草与检查</div></div></div></aside>`;
  const globalHeader = `<header class="global-header row spread" data-region="global-header"><div class="row"><button class="icon-button" aria-label="折叠侧栏">${icon('panel')}</button><span class="divider"></span><button class="row search-trigger">${icon('search')}<span>查找页面或项目</span><kbd>Ctrl K</kbd></button></div><div class="row"><span class="small muted header-status">设计样稿 · 示例数据</span><button class="icon-button" aria-label="令牌设置">${icon('gear')}</button></div></header>`;
  const taskHeader = `<header class="task-header" data-region="task-header"><div class="task-top row"><button class="icon-button" aria-label="折叠侧栏">${icon('panel')}</button><button class="icon-button" aria-label="返回项目">${icon('back')}</button><h1 class="truncate">市政设施运维服务项目</h1><span class="task-id">项目 #101</span>${badge('运行中','blue')}<span class="spacer"></span><span class="task-actions">${button('执行操作','down','small-button')}</span></div><p class="task-subtitle muted">投标截止：2026-11-30 09:00 · 标书待完善 · 设计样稿</p><div class="nav-scroll"><nav class="primary-tabs" data-region="project-tabs">${['项目概览','招标解读','大纲与写作','核验','成稿导出','执行记录'].map(x=>`<button class="primary-tab ${x===(view==='writing'?'大纲与写作':'执行记录')?'active':''}">${x}</button>`).join('')}</nav></div><div class="nav-scroll"><nav class="secondary-tabs">${(view==='writing'?['大纲及审批','章节写作']:['实时过程','要素与结论','工具调用审批','模型用量']).map((x,i)=>`<button class="secondary-tab ${i===(view==='writing'?1:0)?'active':''}">${x}</button>`).join('')}</nav></div></header>`;
  function projects() {
    const rows=[['101','市政设施运维服务项目','整理技术要求与服务方案','运行中','blue'],['102','园区设备维护服务项目','复核设备清单与服务标准','运行中','blue'],['103','公共场馆保洁服务项目','补充人员安排与质量措施','已暂停','amber'],['104','道路照明维护服务项目','核对章节内容与引用依据','运行已结束','green']];
    return `<div class="card" data-region="project-table"><div class="row table-toolbar"><div class="input-wrap table-search">${icon('search')}<input class="input" placeholder="搜索项目名称 / 目标 / 编号" aria-label="搜索项目"></div><select class="input table-filter" aria-label="状态"><option>全部运行状态</option></select><span class="small muted">已加载 4 个项目</span><span class="spacer"></span>${button('新建项目','plus','primary')}</div><div class="table-wrap"><table><colgroup><col style="width:7%"><col style="width:26%"><col style="width:25%"><col style="width:13%"><col style="width:15%"><col style="width:14%"></colgroup><thead><tr>${['编号','项目名称','目标','运行状态','创建时间','操作'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr><td><span class="task-id">${x[0]}</span></td><td style="font-weight:600">${x[1]}</td><td class="muted">${x[2]}</td><td>${badge(x[3],x[4])}</td><td class="small muted">2026-10-29 09:00</td><td><div class="row">${button('进入','arrow','primary small-button')}<button class="icon-button" aria-label="更多操作">${icon('dots')}</button></div></td></tr>`).join('')}</tbody></table></div><div class="row table-footer"><select class="input page-size" aria-label="每页条数"><option>20</option></select><span class="small muted">条/页 · 1–4 / 已加载 4 条</span></div></div>`;
  }
  function execution() {
